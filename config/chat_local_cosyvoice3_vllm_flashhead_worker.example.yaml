default:
  logger:
    log_level: INFO
  service:
    host: 0.0.0.0
    port: 8282
    cert_file: ssl_certs/localhost.crt
    cert_key: ssl_certs/localhost.key
  chat_engine:
    model_root: models
    concurrent_limit: 1
    handler_search_path:
    - src/handlers
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
        output_video_fps: 25
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      SenseVoice:
        enabled: true
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: iic/SenseVoiceSmall
      CosyVoice3:
        enabled: true
        module: tts/cosyvoice3_remote/tts_handler_cosyvoice3_remote
        api_url: http://127.0.0.1:50001
        sample_rate: 24000
        min_text_chars: 8
        max_text_chars: 80
        read_timeout: 60
      LLMOpenAICompatible:
        enabled: true
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: Qwen3-Coder-Next
        enable_video_input: false
        history_length: 20
        system_prompt: 请你扮演一个 AI 助手，用简短的两三句对话来回答用户的问题，并在对话内容中加入合适的标点符号，不需要讨论标点符号相关的内容
        api_url: http://llm.example.invalid:8000/v1/
        api_key: REPLACE_WITH_YOUR_API_KEY
      FlashHead:
        module: avatar/flashhead/avatar_handler_flashhead
        ckpt_dir: models/SoulX-FlashHead-1_3B
        wav2vec_dir: models/wav2vec2-base-960h
        model_type: lite
        cond_image_path: resource/avatar/flashhead/girl.png
        fps: 25
        base_seed: 42
        use_face_crop: false
        debug: false
        idle_noise_amplitude: 0.003
        execution_mode: process
        enable_compile: true
        max_buffer_seconds: 2.0
        worker_start_timeout: 900
